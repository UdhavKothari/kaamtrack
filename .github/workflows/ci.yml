name: CI

# On every push: types, the rule tests, and a production build. The smoke script (npm run smoke) needs a running app
# with its database, so it is run by hand against a preview or the live site.
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
